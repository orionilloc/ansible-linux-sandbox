---
- name: Run daily package updates on Debian family
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Run daily package updates on RedHat family
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: ansible_os_family == "RedHat"

- name: Run daily package updates on SUSE family
  community.general.zypper:
    name: "*"
    state: latest
  when: ansible_os_family == "Suse"

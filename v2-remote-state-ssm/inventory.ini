[al2023]
node-al2023 ansible_host=${al2023_id} ansible_user=ec2-user

[debian]
node-debian ansible_host=${debian_id} ansible_user=admin

[ubuntu]
node-ubuntu ansible_host=${ubuntu_id} ansible_user=ubuntu

[fedora]
node-fedora ansible_host=${fedora_id} ansible_user=fedora

[opensuse]
node-opensuse ansible_host=${opensuse_id} ansible_user=ec2-user

[rhel]
node-rhel ansible_host=${rhel_id} ansible_user=ec2-user

[linux:children]
al2023
debian
ubuntu
opensuse
fedora
rhel

[linux:vars]
ansible_connection=aws_ssm
ansible_aws_ssm_region=us-east-1
ansible_aws_ssm_bucket_name=${s3_bucket_name}
ansible_aws_ssm_plugin_prefix=${s3_prefix}
ansible_remote_tmp=/tmp/.ansible/tmp
ansible_shell_type=sh
ansible_ssm_python_cmd="python3"
ansible_python_interpreter=/usr/bin/python3


